<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SassCalc // The Passive-Aggressive Calculator</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="glow-orb glow-1"></div>
  <div class="glow-orb glow-2"></div>

  <div class="app-container">
    <header class="app-header">
      <div class="logo">
        <span class="logo-accent">//</span> SassCalc<span>v1.0</span>
      </div>
      <button id="audio-toggle" class="audio-btn btn-muted" title="Enable Sarcastic Audio">
        <svg class="speaker-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" class="sound-waves"></path>
        </svg>
        <span>Sound Off</span>
      </button>
    </header>

    <main class="calculator-wrapper">
      <div class="calculator" id="calculator">
        <!-- Dual Display Screen -->
        <div class="screens-container">
          <!-- Sass Box (Top Display) -->
          <div class="screen sass-screen" id="sass-box">
            <span class="sass-label">STATUS:</span>
            <div class="sass-content-wrapper">
              <span class="sass-text" id="sass-text">What do you want?</span>
              <span class="typing-indicator" id="typing-indicator"><span>.</span><span>.</span><span>.</span></span>
            </div>
          </div>
          <!-- Math Box (Bottom Display) -->
          <div class="screen math-screen">
            <div class="expression-line" id="math-expression" placeholder="0"></div>
            <div class="result-line" id="math-result"></div>
          </div>
        </div>

        <!-- Calculator Keypad Grid -->
        <div class="keypad">
          <!-- Row 1: Helpers -->
          <button class="key fn-key" data-action="clear" id="key-clear">C</button>
          <button class="key fn-key" data-action="backspace">⌫</button>
          <button class="key fn-key" data-action="operator" data-val="^">^</button>
          <button class="key op-key" data-action="operator" data-val="/">÷</button>

          <!-- Row 2: Scientific Tries -->
          <button class="key sci-key" data-action="function" data-val="sin(">sin</button>
          <button class="key sci-key" data-action="function" data-val="cos(">cos</button>
          <button class="key sci-key" data-action="function" data-val="sqrt(">sqrt</button>
          <button class="key sci-key" data-action="function" data-val="π">π</button>

          <!-- Row 3: Digits 7,8,9 -->
          <button class="key num-key" data-val="7">7</button>
          <button class="key num-key" data-val="8">8</button>
          <button class="key num-key" data-val="9">9</button>
          <button class="key op-key" data-action="operator" data-val="*">×</button>

          <!-- Row 4: Digits 4,5,6 -->
          <button class="key num-key" data-val="4">4</button>
          <button class="key num-key" data-val="5">5</button>
          <button class="key num-key" data-val="6">6</button>
          <button class="key op-key" data-action="operator" data-val="-">-</button>

          <!-- Row 5: Digits 1,2,3 -->
          <button class="key num-key" data-val="1">1</button>
          <button class="key num-key" data-val="2">2</button>
          <button class="key num-key" data-val="3">3</button>
          <button class="key op-key" data-action="operator" data-val="+">+</button>

          <!-- Row 6: Dot, Zero, Paren, Equals -->
          <button class="key num-key" data-val="(">(</button>
          <button class="key num-key" data-val="0">0</button>
          <button class="key num-key" data-val=")">)</button>
          <button class="key num-key" data-val=".">.</button>
          
          <!-- Equals spans full width of grid bottom or is placed prominently -->
          <button class="key equals-key" id="key-equals">=</button>
        </div>
      </div>
    </main>

    <footer class="app-footer">
      <p>Guaranteed to reduce your self-esteem by 15% per calculation.</p>
    </footer>
  </div>

  <!-- JavaScript -->
  <script src="app.js"></script>
</body>
</html>
