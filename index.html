<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My websites Portfolio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #0d1117; /* GitHub Dark Theme Background */
            color: #c9d1d9;
            margin-top: 80px;
            padding: 0 20px;
        }
        h1 {
            margin-bottom: 25px;
            font-size: 2.2rem;
            font-weight: 600;
        }
        .meme-image {
            display: block;
            margin: 0 auto 35px auto;
            max-width: 250px;
            width: 100%;
            height: auto;
            border-radius: 12px;
            border: 2px solid #30363d;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .meme-image:hover {
            transform: scale(1.04);
            border-color: #58a6ff;
            box-shadow: 0 12px 28px rgba(88, 166, 255, 0.2);
        }
        .links-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .project-link {
            display: inline-block;
            padding: 15px 30px;
            font-size: 20px;
            text-decoration: none;
            color: #58a6ff;
            border: 2px solid #30363d;
            border-radius: 8px;
            transition: 0.3s;
            background-color: transparent;
        }
        .project-link:hover {
            background-color: #30363d;
            color: #ffffff;
            border-color: #8b949e;
        }
    </style>
</head>
<body>

    <h1>Welcome to My websites, just made this because why not?!</h1>
    
    <img src="./why_not.png" alt="Why not?" class="meme-image">
    
    <div class="links-container">
        <a href="./sass-calculator/index.html" class="project-link">Sass Calculator</a>
        <a href="./roast-me-ai/index.html" class="project-link">Roast Me AI</a>
    </div>

</body>
</html>
